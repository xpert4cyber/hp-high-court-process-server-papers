<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" aria-label="HPProcessServerPapers Open Graph Banner">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ogCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ogSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Mountain Silhouette in Background -->
  <path d="M 0 480 L 180 280 L 420 540 L 680 200 L 960 480 L 1200 290 L 1200 630 L 0 630 Z" fill="#132238" opacity="0.6" />
  <path d="M 0 540 L 280 340 L 520 560 L 780 280 L 1020 520 L 1200 370 L 1200 630 L 0 630 Z" fill="#0d192c" opacity="0.8" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentGrad)" />

  <!-- Central Card Content -->
  <g transform="translate(80, 75)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="220" height="38" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="110" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">
      HP HIGH COURT EXAM PREP
    </text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      HP High Court Process Server
    </text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">
      Previous Year Papers &amp; Free Mock Tests
    </text>

    <!-- Description -->
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">
      50-Mark Screening Test Simulator • 2022 Solved Question Paper • HP GK Bank
    </text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">
      Hindi Essay &amp; English Application Practice • 100% Free &amp; Independent
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 310)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="220" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#38bdf8">50 MCQs</text>
      <text x="24" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Screening Test Engine</text>

      <!-- Badge 2 -->
      <rect x="240" y="0" width="230" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <text x="264" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#10b981">500+ Questions</text>
      <text x="264" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Verified HP GK &amp; Subjects</text>

      <!-- Badge 3 -->
      <rect x="490" y="0" width="240" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <text x="514" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#fbbf24">40M Written</text>
      <text x="514" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Hindi Essay &amp; English Letter</text>
    </g>

    <!-- Domain Footer in Graphic -->
    <g transform="translate(0, 430)">
      <circle cx="16" cy="16" r="16" fill="#059669" />
      <path d="M 11 16 L 15 20 L 22 12" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
        HPProcessServerPapers (HPPSP) • GitHub Pages Ready
      </text>
    </g>
  </g>

  <!-- Right Floating Emblem -->
  <g transform="translate(900, 150)">
    <circle cx="100" cy="100" r="110" fill="#1e293b" stroke="#334155" stroke-width="4" opacity="0.9" />
    <circle cx="100" cy="70" r="30" fill="url(#ogSun)" />
    <!-- Mountains -->
    <path d="M 30 145 L 80 65 L 130 145 Z" fill="#2563eb" />
    <path d="M 80 65 L 95 88 L 86 84 L 75 95 Z" fill="#ffffff" />
    <path d="M 65 145 L 120 45 L 175 145 Z" fill="#38bdf8" />
    <path d="M 120 45 L 138 72 L 130 68 L 118 78 Z" fill="#ffffff" />
    <!-- Book -->
    <path d="M 38 150 C 72 142, 95 152, 100 156 C 105 152, 128 142, 162 150 L 158 172 C 128 165, 106 172, 100 176 C 94 172, 72 165, 42 172 Z" fill="#059669" />
    <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">HPPSP</text>
  </g>
</svg>
