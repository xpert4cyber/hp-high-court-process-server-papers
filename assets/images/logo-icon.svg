<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="HPPSP Logo Icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Radiating Sun of Knowledge -->
  <circle cx="60" cy="46" r="22" fill="url(#goldGrad)" opacity="0.85" filter="url(#subtleShadow)" />
  <circle cx="60" cy="46" r="16" fill="#fef3c7" opacity="0.9" />

  <!-- Background Mountain Peaks -->
  <path d="M 18 78 L 46 36 L 74 78 Z" fill="url(#mountainGrad1)" opacity="0.9" />
  <!-- Snowcap Left -->
  <path d="M 46 36 L 54 48 L 48 46 L 43 51 L 38 47 Z" fill="url(#snowGrad)" />

  <!-- Central & Foreground Mountain Peak -->
  <path d="M 40 78 L 68 28 L 98 78 Z" fill="url(#mountainGrad2)" />
  <!-- Snowcap Central -->
  <path d="M 68 28 L 78 44 L 72 41 L 65 47 L 60 41 L 57 44 Z" fill="url(#snowGrad)" />

  <!-- Right Mountain Ridge -->
  <path d="M 62 78 L 86 42 L 104 78 Z" fill="url(#mountainGrad1)" opacity="0.8" />
  <!-- Snowcap Right -->
  <path d="M 86 42 L 92 52 L 87 50 L 82 54 Z" fill="url(#snowGrad)" />

  <!-- Open Educational Book at Base -->
  <g filter="url(#subtleShadow)">
    <!-- Book Cover Base -->
    <path d="M 22 84 C 42 80, 56 86, 60 88 C 64 86, 78 80, 98 84 L 96 97 C 76 93, 64 97, 60 99 C 56 97, 44 93, 24 97 Z" fill="#065f46" />
    <!-- Left Page -->
    <path d="M 24 82 C 42 77, 56 83, 59 85 L 59 96 C 56 94, 42 88, 24 93 Z" fill="#f8fafc" />
    <!-- Right Page -->
    <path d="M 96 82 C 78 77, 64 83, 61 85 L 61 96 C 64 94, 78 88, 96 93 Z" fill="#ffffff" />
    <!-- Book Spine Rib -->
    <line x1="60" y1="85" x2="60" y2="99" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <!-- Page Lines Left -->
    <line x1="32" y1="84" x2="52" y2="82" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="32" y1="88" x2="52" y2="86" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <!-- Page Lines Right -->
    <line x1="68" y1="82" x2="88" y2="84" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="68" y1="86" x2="88" y2="88" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Monogram Pill at bottom -->
  <rect x="36" y="99" width="48" height="14" rx="7" fill="#047857" stroke="#10b981" stroke-width="1" />
  <text x="60" y="109.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">HPPSP</text>
</svg>
