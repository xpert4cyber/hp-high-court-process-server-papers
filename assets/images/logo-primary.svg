<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" aria-label="HPProcessServerPapers Primary Logo">
  <defs>
    <linearGradient id="pMountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="pDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 5)">
    <!-- Rounded Container -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Sun -->
    <circle cx="40" cy="30" r="14" fill="url(#pSunGrad)" />
    
    <!-- Left Mountain -->
    <path d="M 12 56 L 30 25 L 48 56 Z" fill="#1d4ed8" opacity="0.9" />
    <path d="M 30 25 L 35 34 L 31 33 L 28 36 L 25 33 Z" fill="#ffffff" />
    
    <!-- Center Mountain -->
    <path d="M 26 56 L 46 19 L 66 56 Z" fill="#38bdf8" />
    <path d="M 46 19 L 53 31 L 49 29 L 44 33 L 40 29 L 38 31 Z" fill="#ffffff" />
    
    <!-- Open Book -->
    <path d="M 15 58 C 28 55, 38 59, 40 61 C 42 59, 52 55, 65 58 L 64 68 C 51 65, 43 68, 40 69 C 37 68, 29 65, 16 68 Z" fill="#047857" />
    <path d="M 16 57 C 28 53, 37 57, 39 59 L 39 67 C 37 65, 28 61, 16 65 Z" fill="#f8fafc" />
    <path d="M 64 57 C 52 53, 43 57, 41 59 L 41 67 C 43 65, 52 61, 64 65 Z" fill="#ffffff" />
    <line x1="40" y1="59" x2="40" y2="69" stroke="#fbbf24" stroke-width="1.8" />
    
    <!-- Monogram badge -->
    <rect x="23" y="70" width="34" height="8" rx="4" fill="#059669" />
    <text x="40" y="76.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">HPPSP</text>
  </g>

  <!-- Typography Block -->
  <g transform="translate(105, 12)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="25" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#0f172a">HPProcessServer</tspan><tspan fill="#1d4ed8">Papers</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="0.3">
      Himachal Pradesh High Court Exam Preparation Portal
    </text>

    <!-- Verification / Focus Tags -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="70" height="15" rx="3.5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8" />
      <text x="35" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">PYQ &amp; SOLVED</text>

      <rect x="76" y="0" width="74" height="15" rx="3.5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
      <text x="113" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">MOCK TESTS</text>

      <rect x="156" y="0" width="82" height="15" rx="3.5" fill="#fefce8" stroke="#fef08a" stroke-width="0.8" />
      <text x="197" y="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">HP GK SPECIAL</text>
    </g>
  </g>
</svg>
